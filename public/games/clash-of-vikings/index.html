<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clash of Vikings</title>
<style>
:root{color-scheme:dark;--bg:#0d1420;--pn:#182234;--p2:#223149;--mu:#8fa0b5;--ac:#f5b53d;--rd:#e5484d;--gr:#34c38f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;color:#eef2f7;background:var(--bg);font:600 15px/1.35 system-ui,'Inter','Segoe UI',Roboto,sans-serif;overflow:hidden;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{position:absolute;inset:0;display:none;padding:18px 16px;overflow:auto;touch-action:pan-y;background:radial-gradient(circle at 50% -10%,#24385c,var(--bg) 65%)}
.scr.on{display:flex;flex-direction:column;align-items:center}
#menu{justify-content:center}
h1{margin:4px 0;font-size:clamp(30px,8vw,48px);font-weight:800;color:var(--ac);text-shadow:0 3px 0 #6b4200;text-align:center}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px;text-align:center}.mu{color:var(--mu);margin:2px 0;font-size:12px}
.btn{width:100%;padding:14px 18px;border-radius:14px;background:var(--p2);font-weight:700;box-shadow:0 2px 0 #0007,0 6px 14px #0004;transition:transform .15s,background .15s}
.btn:hover{background:#2f4468;transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.pri{background:linear-gradient(#f7c862,#e39a1d);color:#2a1800}.pri:hover{background:linear-gradient(#ffd878,#f0a928)}
.btn[disabled]{opacity:.4;pointer-events:none}
.mg,.grid,.list{display:grid;gap:10px;width:min(440px,100%)}.grid{grid-template-columns:1fr 1fr}
.pill{display:inline-block;margin:3px;padding:8px 14px;border-radius:99px;background:var(--pn);box-shadow:0 2px 6px #0005}.pill b{color:var(--ac)}
@media(min-width:900px) and (min-height:560px){.mg{grid-template-columns:1fr 1fr;width:660px}.wide{grid-column:1/-1}.grid{grid-template-columns:repeat(4,1fr);width:820px}.list{width:640px}h1{font-size:60px}}
.tile{position:relative;padding:12px 8px;border-radius:14px;background:var(--pn);text-align:center;box-shadow:0 2px 8px #0005;overflow:hidden;transition:transform .15s;cursor:pointer}
.tile:hover{transform:translateY(-3px)}.tile img{width:72px;height:72px}
.tile.in{outline:2px solid var(--gr)}.tile.lk img{filter:grayscale(1) brightness(.5)}
.tile button{margin-top:6px;padding:6px 10px;border-radius:10px;background:var(--p2);font-size:12px}
.rw{display:flex;gap:14px;align-items:center;text-align:left}
.foil{background:linear-gradient(115deg,#35255f,#6a35a8 35%,#1f6b8c 65%,#35255f)}
.foil::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff7 50%,transparent 65%) 130% 0/250% 100%;transition:background-position .7s}
.foil:hover::after{background-position:-30% 0}
#game{padding:0;justify-content:center}
#gw{position:relative;width:360rem;background:#0b1220;border-radius:14rem;box-shadow:0 10px 50px #000b;overflow:hidden}
#top,#bot{padding:4rem 6rem;background:var(--pn)}
.hud{display:flex;align-items:center;justify-content:space-between;height:32rem;font-size:15rem}
.ib{width:30rem;height:26rem;border-radius:8rem;background:var(--p2);font-size:12rem;font-weight:800}
#tm{font-size:20rem}
#cv{display:block;width:360rem;height:540rem}
.hand{display:flex;gap:5rem;align-items:flex-end;justify-content:center}
.cd{position:relative;width:68rem;height:80rem;border-radius:10rem;background:linear-gradient(#2c4062,#1b2740);box-shadow:0 2rem 0 #0008;transition:transform .15s;padding:0;overflow:hidden}
.cd:hover{transform:translateY(-3rem)}.cd img{width:100%;height:76%;object-fit:contain}
.cd i{position:absolute;left:3rem;top:3rem;width:20rem;height:20rem;border-radius:50%;background:#b146f0;font:800 12rem/20rem system-ui;font-style:normal;text-align:center}
.cd small{position:absolute;bottom:3rem;left:0;right:0;font-size:9rem;color:var(--mu);text-align:center}
.cd.sel{outline:2rem solid var(--ac);transform:translateY(-8rem)}.cd.no{opacity:.5;filter:grayscale(.6)}
.nx{width:36rem;height:44rem;opacity:.8}.nx img{height:100%}
.eb{position:relative;height:14rem;margin:2rem 0 5rem;background:#0008;border-radius:8rem;overflow:hidden}
.eb i{position:absolute;inset:0 auto 0 0;width:50%;background:linear-gradient(90deg,#b146f0,#e08cff)}
.eb b{position:absolute;inset:0;text-align:center;font-size:10rem;line-height:14rem}
.one #eb1,.one #h1{display:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(4px)}#ov.on{display:flex}
.pnl{width:min(360px,92vw);padding:22px;border-radius:18px;background:var(--pn);box-shadow:0 12px 40px #000c;text-align:center}
.pnl h2{margin:0 0 10px;font-size:34px;color:var(--ac)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fff1}
#road{scroll-behavior:smooth;overscroll-behavior:contain}#menu{padding:0;justify-content:flex-start}.hub{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;background:linear-gradient(#1a202c,#2d3748);border-bottom:3px solid #4a5568}.avatar{position:relative;flex:none;width:46px;height:46px;border-radius:10px;background:linear-gradient(145deg,#f6e05e,#f6ad55);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px}.avatar b{position:absolute;bottom:-7px;right:-7px;background:#805ad5;border:2px solid #fff;border-radius:8px;font-size:12px;padding:0 5px}.xb{flex:1;min-width:0}.xb small{font-size:13px;color:#cbd5e0}.bar{height:12px;background:#1a202c;border:2px solid #a0aec0;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b794f4,#805ad5)}.pl{background:rgba(0,0,0,.45);border:2px solid #4a5568;border-radius:14px;padding:2px 8px;white-space:nowrap}.hb{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}.panel{width:100%;background:rgba(0,0,0,.35);border:3px solid #4a5568;border-radius:16px;padding:12px;text-align:center}.arena{background:radial-gradient(circle,#2e5b3c,#224631);border-color:#f6ad55}.nav{display:flex;background:linear-gradient(#2d3748,#1a202c);border-top:3px solid #4a5568;padding:0 4px env(safe-area-inset-bottom,0px)}.tab{flex:1;padding:8px 0 6px;text-align:center;font-size:13px;color:#a0aec0;cursor:pointer;transition:transform .15s}.tab i{display:block;font-size:22px;font-style:normal}.tab.on{color:#2d3748;background:linear-gradient(#f6e05e,#f6ad55);border-radius:12px 12px 0 0;transform:translateY(-6px);padding-bottom:12px}.hub .grid{grid-template-columns:1fr 1fr;width:100%}.hub .list{width:100%}.rr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;width:100%}.rb{padding:10px 8px;border-radius:12px;background:var(--p2);border:2px solid #4a5568;text-align:center}.rb small{display:block;font-size:11px;color:var(--mu);font-weight:500}.rb.on{border-color:#f6e05e;background:#3b4a63}.rb.lk{opacity:.5}
.chestbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#293e5a,#182638);border-color:#c58a31}.chesticon{font-size:38px;filter:drop-shadow(0 4px 3px #0008)}.rb img{object-fit:contain}.rb:active{transform:scale(.97)}.arena{box-shadow:inset 0 0 25px #f6ad5520,0 6px 18px #0006}.panel{box-shadow:0 5px 16px #0005}.tab{font-weight:800}.tab.on{color:#2d3748}.cd{border:2px solid #8296b4}.cd.sel{border-color:#ffe066;box-shadow:0 0 0 2px #f6ad5566,0 8px 18px #0008}.tile{border:1px solid #ffffff12}.rb.on{box-shadow:0 0 0 2px #f6e05e55}#matchnames{color:#f6d58a;font-weight:800;letter-spacing:.2px}.emote-ui{position:relative;z-index:8;width:100%;min-height:36rem;display:none;align-items:center;justify-content:flex-end;gap:7rem;margin:3rem 0 5rem}.emote-ui.on{display:flex}.emote-toggle{border:2px solid #f6ad55;border-radius:12rem;min-width:42rem;height:34rem;background:linear-gradient(#3b5276,#25354d);font-size:20rem;box-shadow:0 3px 10px #0008}.emote-tray{display:none;position:absolute;right:0;bottom:calc(100% + 6rem);padding:8rem;background:linear-gradient(145deg,#243957,#101a2d);border:2px solid #f6ad55;border-radius:14rem;grid-template-columns:repeat(4,minmax(36rem,44rem));gap:6rem;box-shadow:0 8px 24px #000b;animation:emoteIn .16s ease-out}.emote-tray.on{display:grid}.emote-pick{height:38rem;border-radius:10rem;background:linear-gradient(#3c5274,#263751);font-size:22rem;border:1px solid #ffffff22}.emote-pick:active{transform:scale(.92)}.emote-toast{position:absolute;z-index:9;left:50%;bottom:112rem;top:auto;transform:translateX(-50%);display:none;padding:7rem 13rem;border-radius:18rem;background:#172238ee;border:2px solid #f6ad55;font-size:28rem;box-shadow:0 4px 16px #0009;white-space:nowrap;pointer-events:none}.emote-toast.on{display:block;animation:emoteIn .18s ease-out}@keyframes emoteIn{from{opacity:0;transform:translateY(7rem) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}.rw{min-height:76px}
@keyframes sp{to{transform:rotate(1turn)}}
#mo{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:#000b;backdrop-filter:blur(4px)}#mo.on{display:flex}#mo .pnl{max-height:92vh;overflow:auto;touch-action:pan-y}
.chh{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px}.chh b{font-size:16px}
.sls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.sl{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:106px;padding:8px 2px 12px;border-radius:12px;background:linear-gradient(#2a3b57,#1a2538);border:2px solid #4a5568;font-size:11px;overflow:hidden}
.sl.em{border-style:dashed;opacity:.5;justify-content:center}.sl.ul{border-color:#f6ad55}.sl.go{border-color:var(--gr);box-shadow:0 0 14px #34c38f88;animation:pu .8s infinite alternate}
.sl small{font-size:10px;color:var(--mu);font-weight:700}.sl.go small{color:var(--gr)}
.cs{width:44px;height:44px}.cs svg{display:block;width:100%;height:100%}
.pb{position:absolute;left:5px;right:5px;bottom:4px;height:5px;border-radius:4px;background:#0009;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f6e05e,#f6ad55)}
.rar{font-size:10px;font-weight:800;letter-spacing:.3px}.chip{display:inline-block;margin:2px;padding:2px 9px;border-radius:99px;border:1px solid;font-size:11px;font-weight:800}
.rh{grid-column:1/-1;text-align:left;font-weight:800;padding:2px 2px 4px;border-bottom:2px solid}.tile[data-c]{border-top:3px solid var(--rc)}
@keyframes pu{to{transform:scale(1.05)}}
/* ===== Battle deck + rune picker (Clash Royale style) ===== */
.hb.kbg{background:linear-gradient(#1648ac,#0f3079 40%,#0a1f58)}
.kd,.kd2{width:100%;font-size:clamp(10px,2.9vw,14.5px)}
.kd{padding:.9em .7em .9em;border-radius:1.5em;background:linear-gradient(#0b2563aa,#081d52cc);box-shadow:inset 0 0 0 2px #2f66d0,inset 0 0 0 4px #09194a,0 6px 16px #0006}
.kh{display:flex;align-items:center;justify-content:space-between;margin:0 .15em .5em}
.kh b{font-size:1.5em;font-weight:900;color:#fff;text-shadow:0 .1em 0 #06143a,.06em 0 0 #06143a,-.06em 0 0 #06143a,0 -.06em 0 #06143a}
.kcnt{padding:.15em .8em;border-radius:99px;background:#07173f;color:#ffd35c;font-size:1.05em;font-weight:900;box-shadow:inset 0 0 0 1px #2a4a9a}
.kd .sub{margin:0 .2em .8em;min-height:2.7em;font-size:1.05em;color:#aac5f6;text-align:left}
.kg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55em;width:100%}
.kd2{margin-top:.3em}.kd2 .kh{margin-top:.8em}
.kg .rh{font-size:1.1em;margin-top:.5em}

/* slot tile that holds one card */
.ks{--q1:#86a9dc;--q2:#2f4f86;--b1:#2b3d7d;--b2:#18244f;--bt:#b4e2ff;--bo:#08113a;position:relative;display:flex;flex-direction:column;gap:.4em;min-width:0;padding:.55em .4em .4em;border-radius:.9em;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6,0 .15em 0 #04102f;cursor:pointer;touch-action:manipulation;transition:transform .12s}
.ks:active{transform:scale(.96)}
.ks:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(hover:hover){.ks:hover{transform:translateY(-2px)}.ks:active{transform:scale(.96)}}
.q-c{--q1:#86a9dc;--q2:#2f4f86;--b1:#2b3d7d;--b2:#18244f;--bt:#b4e2ff;--bo:#08113a}
.q-r{--q1:#f8b866;--q2:#b4620f;--b1:#df8123;--b2:#a9560b;--bt:#ffe596;--bo:#4a2200}
.q-e{--q1:#dc98ff;--q2:#7a34c0;--b1:#e8b6fb;--b2:#bb78e8;--bt:#5b2092;--bo:#fff}
.q-l{--q1:#8ff6e8;--q2:#18808f;--b1:#52e6d4;--b2:#1c98ac;--bt:#ffbdf2;--bo:#07404c}
.ks.sel{background:linear-gradient(#1b5bb8,#12408a);box-shadow:inset 0 0 0 2px #8ff0ff,0 0 0 2px #1d9be0,0 0 .9em .15em #35d0ffaa;animation:kpop .28s ease-out}
.ks.nw{animation:kpop .32s ease-out}
@keyframes kpop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.ks.sel,.ks.nw{animation:none}}

/* gold frame + portrait (chamfered like the real card) */
.kc{position:relative;width:100%;aspect-ratio:.88;background:linear-gradient(155deg,#fff2a8,#f4bd32 35%,#c4821a 68%,#f7d35f);clip-path:polygon(20% 0,80% 0,100% 11%,100% 90%,80% 100%,20% 100%,0 90%,0 11%)}
.kp{position:absolute;inset:.34em;overflow:hidden;background:radial-gradient(circle at 50% 36%,var(--q1),var(--q2) 78%);clip-path:polygon(20% 0,80% 0,100% 11%,100% 90%,80% 100%,20% 100%,0 90%,0 11%)}
.kp img{position:absolute;left:7%;top:5%;width:86%;height:74%;object-fit:contain;filter:drop-shadow(0 .15em .2em #0008)}
.kp::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 38%,#ffffff2e 50%,transparent 62%);pointer-events:none}
.kl{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:.24em 0 .3em;text-align:center;font-size:.95em;font-weight:900;line-height:1.1;color:var(--bt);background:linear-gradient(var(--b1),var(--b2));text-shadow:0 .07em 0 var(--bo),.06em 0 0 var(--bo),-.06em 0 0 var(--bo),0 -.06em 0 var(--bo),.05em .05em 0 var(--bo),-.05em .05em 0 var(--bo);box-shadow:inset 0 1px 0 #ffffff55}
.ks.lk .kc{filter:saturate(.3) brightness(.7)}
.ks.lk .kp{background:radial-gradient(circle at 50% 36%,#52607a,#222c42 80%)}
.ks.lk .kp img{filter:grayscale(1) brightness(.55)}
.ks.lk .kl{--b1:#3a4660;--b2:#222b40;--bt:#9aa8c4;--bo:#0b1226}

/* elixir drop */
.kx,.kdrop{display:flex;align-items:center;justify-content:center;border-radius:50% 0 50% 50%;background:radial-gradient(circle at 35% 30%,#ff9bff,#cf3cee 45%,#7a16a8);border:.14em solid #f6d0ff;box-shadow:0 .12em .25em #0008,inset 0 -.15em .2em #5b0f7e88}
.kx{position:absolute;z-index:2;left:-.25em;top:-.25em;width:2.1em;height:2.1em;font-size:1.05em;font-weight:900;font-style:normal;line-height:1;color:#fff;text-shadow:0 .07em 0 #4b0a66,.06em 0 0 #4b0a66,-.06em 0 0 #4b0a66,0 -.06em 0 #4b0a66}
.ks.lk .kx{filter:grayscale(.8) brightness(.8)}
.kt{margin:-.1em 0 -.05em;overflow:hidden;font-size:.8em;font-weight:800;line-height:1.15;color:#d4e3ff;text-align:center;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 #04102f}
.kt.s{font-size:.7em}
.kt.ph{visibility:hidden}
.ks.lk .kt{color:#8b9cc0}

/* Elite pill and upgrade pill under every card */
.kb{position:relative;display:flex;align-items:center;justify-content:center;gap:.35em;height:2em;margin:0;padding:0 .3em;border:0;font-size:.9em;font-weight:900;line-height:1;color:#fff;white-space:nowrap}
.kb.ph{visibility:hidden}
.kb.el{justify-content:space-between;padding:0 .8em;background:linear-gradient(#fff3a6,#f6c940 40%,#d89a1a);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);text-shadow:0 .07em 0 #8b5400,.06em 0 0 #8b5400,-.06em 0 0 #8b5400,0 -.06em 0 #8b5400}
.kb.el::before,.kb.el::after{content:'';flex:none;width:.5em;height:.5em;background:linear-gradient(#8fd0ff,#2f86e6);border:.1em solid #eaf6ff;transform:rotate(45deg)}
.kb.up{background:#15286a;border-radius:1em;color:#aab8ea;font-size:.78em;font-weight:800;justify-content:flex-start;padding:0 .55em 0 .35em;box-shadow:inset 0 0 0 1px #2a448f}
.kb.up svg{flex:none;width:1.5em;height:1.5em;fill:#ffc12b;stroke:#b9770a;stroke-width:1.2;stroke-linejoin:round}
.kb.up.ok{background:linear-gradient(#7bea6f,#2fae3a);color:#fff;box-shadow:inset 0 0 0 1px #c9ffbf,0 .12em 0 #17661d;text-shadow:0 1px 0 #17661d}
.kb.up.ok svg{fill:#fff;stroke:#17661d}
.ko{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:.88;border:2px dashed #3f66b8;border-radius:.8em;color:#5f86da;font-size:2.4em;font-weight:900;line-height:1}
.ks.em{cursor:default;background:linear-gradient(#0d2356,#081a42);opacity:.85}
.ks.em:active{transform:none}

/* footer: average elixir + runes button */
.kf{display:flex;align-items:center;justify-content:space-between;margin-top:.8em;padding:0 .1em}
.kv{display:flex;align-items:center;gap:.8em;height:4em;padding:0 1.4em 0 1em;border-radius:.9em;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6}
.kv b{font-size:1.9em;font-weight:900;color:#fff;text-shadow:0 .07em 0 #06143a,.06em 0 0 #06143a,-.06em 0 0 #06143a,0 -.06em 0 #06143a}
.kdrop{flex:none;width:2.2em;height:2.2em}
.km{position:relative;width:4.4em;height:4.4em;padding:.22em;border-radius:1em;background:linear-gradient(#ffe48a,#f0b32a 45%,#b8740f);box-shadow:0 .18em 0 #6a3d00,0 .3em .6em #0007;display:block;transition:transform .12s}
.km:active{transform:scale(.94)}
.km:focus-visible{outline:2px solid #fff;outline-offset:3px}
.kin{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:.78em;background:radial-gradient(circle at 50% 30%,#30d0c4,#14687f 70%,#0c3d58);box-shadow:inset 0 0 0 .1em #0a3a52,inset 0 .1em .3em #7ff6e866}
.kst{display:flex;align-items:center;justify-content:center;width:62%;height:78%;border-radius:48% 48% 14% 14%/30% 30% 10% 10%;background:linear-gradient(#cdd7ea,#8593b0 55%,#5b6785);box-shadow:inset 0 0 0 .1em #eef3fb99,0 .15em .25em #0008}
.kgl{width:56%;height:68%;color:#58f2ff;filter:drop-shadow(0 0 .25em #34e0ff)}
.kgl.off{color:#6a7898;filter:none;opacity:.85}
.kn{position:absolute;right:-.55em;top:-.65em;display:flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .35em;border-radius:.45em;background:linear-gradient(#ff6a6a,#d71f2b);border:.14em solid #fff;color:#fff;font-size:.95em;font-style:normal;font-weight:900;text-shadow:0 1px 0 #7a0b12;box-shadow:0 .1em .2em #0007}

/* rune picker sheet */
#mo .pnl.kr{display:flex;flex-direction:column;overflow:hidden;max-height:min(92vh,760px);width:min(390px,94vw);padding:16px 12px 14px;background:linear-gradient(#17479f,#0d2c70);border:3px solid #f1b92f;box-shadow:inset 0 0 0 2px #0a1f55,0 14px 40px #000c}
.kr h2{margin:0 0 2px;font-size:28px;color:#fff;text-shadow:0 2px 0 #06143a}
.kr .sub{margin:0 0 10px;font-size:13px;color:#aac5f6}
.kr #rmsg{flex:none;min-height:2.7em;margin:8px 0 6px;color:#ffd35c}
.kr .btn{flex:none}
.rg2{display:grid;flex:1;grid-template-columns:1fr 1fr;gap:8px;min-height:0;padding:3px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.rn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;border-radius:14px;background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px #2a4fa6;text-align:center;color:#fff;transition:transform .12s}
.rn:active{transform:scale(.97)}
.rn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.rn b{font-size:15px;font-weight:900}
.rn small{min-height:2.5em;font-size:11px;font-weight:600;color:#aac5f6;line-height:1.25}
.rn em{font-style:normal;font-size:11px;font-weight:900;color:#7fa2e0}
.rn.on{background:linear-gradient(#1b5bb8,#12408a);box-shadow:inset 0 0 0 2px #ffd35c,0 0 14px #ffc23e88}
.rn.on em{color:#ffd35c}
.rn.lk{opacity:.55}
.rm{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cdd7ea,#7c8aa8 60%,#4d5876);box-shadow:inset 0 0 0 2px #f1b92f,0 3px 6px #0007;color:#52f0ff}
.rm svg{width:44%;height:68%;filter:drop-shadow(0 0 3px #29d8ff)}
.rn.lk .rm{color:#4f5b79}.rn.lk .rm svg{filter:none}
#bot{position:relative}.emote-ui{position:absolute;left:8rem;right:auto;bottom:calc(100% + 6rem);width:auto;min-height:0;margin:0;justify-content:flex-start}.emote-tray{left:0;right:auto}
/* ===================== UNIFIED UI: every screen uses the deck-screen look =====================
   Tokens taken from the Cards tab: royal-blue field, double-ring blue frames, white headings
   with a navy outline, navy pills with gold numbers, one gold button style. UI only. */
:root{--bg:#0a1f58;--pn:#112b68;--p2:#1a3f8f;--mu:#9db9ee;--ac:#ffd35c;--gr:#5fe36f;--rd:#ff5d62;--navy:#06143a;--ring:#2a4fa6}
html,body{background:var(--bg)}
.scr{background:radial-gradient(120% 55% at 50% -8%,#2d72e6,transparent 62%),linear-gradient(#1648ac,#0f3079 40%,#0a1f58)}
.hb{background:linear-gradient(#1648ac,#0f3079 40%,#0a1f58)}

/* type */
h1{font-weight:900;color:var(--ac);text-shadow:0 .08em 0 #06143a,.05em 0 0 #06143a,-.05em 0 0 #06143a,0 -.05em 0 #06143a}
.sub{color:#aac5f6}
.panel h2,.pnl h2{font-weight:900;color:#fff;text-shadow:0 .08em 0 #06143a,.05em 0 0 #06143a,-.05em 0 0 #06143a,0 -.05em 0 #06143a}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .kh{font-size:clamp(10px,2.9vw,14.5px)}
.chh b{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #06143a,1px 0 0 #06143a,-1px 0 0 #06143a,0 -1px 0 #06143a}
.chh .mu{margin:0;padding:3px 11px;border-radius:99px;background:#07173f;color:#ffd35c;font-weight:900;box-shadow:inset 0 0 0 1px var(--ring)}

/* frames */
.panel{padding:14px 12px;border:0;border-radius:22px;background:linear-gradient(#0b2563aa,#081d52cc);box-shadow:inset 0 0 0 2px #2f66d0,inset 0 0 0 4px #09194a,0 6px 16px #0006}
.panel .panel{background:linear-gradient(#112b68,#0a1d4b);box-shadow:inset 0 0 0 1px var(--ring),0 3px 0 #04102f;border-radius:16px;padding:12px}
.panel.arena{background:radial-gradient(120% 140% at 50% 0,#3b82f0,#164aae 55%,#0c2a72);box-shadow:inset 0 0 0 3px #f1b92f,inset 0 0 0 5px #0a1f55,0 8px 20px #0007}
.panel.arena .mu{color:#cfe0ff}
.pnl{border:3px solid #f1b92f;border-radius:20px;background:linear-gradient(#17479f,#0d2c70);box-shadow:inset 0 0 0 2px #0a1f55,0 14px 40px #000c}
#mo{background:#030d2bcc}#ov{z-index:30;background:#030d2baa}
.row{border-bottom:1px solid var(--ring)}.row b{color:#ffd35c}
.pnl input{background:#07173f!important;border:2px solid #2f66d0!important;color:#fff!important;box-shadow:inset 0 2px 6px #0007}
.pnl input:focus{outline:0;border-color:#ffd35c!important}

/* buttons: blue by default, gold for the main action */
.btn{border-radius:14px;background:linear-gradient(#2d72dc,#1550b0);color:#fff;font-weight:900;text-shadow:0 1px 0 #06143a,1px 0 0 #06143a,-1px 0 0 #06143a,0 -1px 0 #06143a;box-shadow:inset 0 2px 0 #8dbaff,inset 0 -3px 0 #0e3478,0 3px 0 #06143a,0 7px 12px #0006}
.btn:hover{background:linear-gradient(#3a82ee,#1a5cc4);transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #8dbaff,inset 0 -3px 0 #0e3478,0 1px 0 #06143a}
.pri,.tile .btn.pri,.tile .btn[data-trclaim]{background:linear-gradient(#ffe48a,#f0b32a 45%,#b8740f);color:#fff;text-shadow:0 1px 0 #6a3d00,1px 0 0 #6a3d00,-1px 0 0 #6a3d00,0 -1px 0 #6a3d00;box-shadow:inset 0 2px 0 #fff3b8,inset 0 -4px 0 #a8650a,0 4px 0 #6a3d00,0 8px 14px #0007}
.pri:hover,.tile .btn.pri:hover,.tile .btn[data-trclaim]:hover{background:linear-gradient(#fff0a8,#f6c23c 45%,#c9830f)}
.pri:active,.tile .btn.pri:active,.tile .btn[data-trclaim]:active{box-shadow:inset 0 2px 0 #fff3b8,inset 0 -4px 0 #a8650a,0 1px 0 #6a3d00}
.btn[disabled]{opacity:.45;filter:grayscale(.45)}

/* slot-style tiles: tiles, tier/emote/event buttons, chest slots */
.tile,.rb,.sl{border:0;background:linear-gradient(#112b68,#0a1d4b);color:#fff;box-shadow:inset 0 0 0 1px var(--ring),0 3px 0 #04102f}
.tile{border-radius:14px}
.tile.in{outline:0;box-shadow:inset 0 0 0 2px #5fe36f,0 3px 0 #04102f}
.tile.lk{background:linear-gradient(#0d2356,#081a42);opacity:.75}
.tile.lk img{filter:grayscale(1) brightness(.55)}
.rb{border-radius:14px;font-weight:900}
.rb small{color:#aac5f6;font-weight:700}
.rb.on{background:linear-gradient(#1b5bb8,#12408a);box-shadow:inset 0 0 0 2px #ffd35c,0 0 14px #ffc23e88}
.rb.lk,.rb[disabled]{opacity:.5}.rb[disabled]{filter:grayscale(.5);pointer-events:none}
.chip{background:#07173f;font-weight:900}
.sl{border:2px solid transparent;font-weight:800}
.sl.em{border:2px dashed #3f66b8;background:linear-gradient(#0d2356,#081a42);box-shadow:none}
.sl.ul{box-shadow:inset 0 0 0 2px #f1b92f,0 3px 0 #04102f}
.sl.go{box-shadow:inset 0 0 0 2px #8bf59a,0 0 14px #52d96b99,0 3px 0 #04102f}
.sl small{color:#aac5f6}.sl.go small{color:#8bf59a}
.pb{background:#07173f;box-shadow:inset 0 0 0 1px var(--ring)}
.pb i,.bar i{background:linear-gradient(#fff3a6,#f6c940 45%,#d89a1a)}

/* top bar, progress bars, bottom nav */
.topbar{background:linear-gradient(#1d58c4,#123c94);border-bottom:0;box-shadow:inset 0 -3px 0 #09194a,0 4px 12px #0006}
.avatar{background:radial-gradient(circle at 50% 36%,#86a9dc,#2f4f86 78%);border:3px solid #f4bd32;box-shadow:0 0 0 2px #6a3d00,0 3px 6px #0007}
.avatar b{background:linear-gradient(#59b8ff,#1d6fd6);border-color:#fff;font-weight:900}
.xb small{color:#aac5f6;font-weight:800}
.bar{background:#07173f;border:0;box-shadow:inset 0 0 0 1px var(--ring)}
.xb .bar i{background:linear-gradient(#9bf0ff,#1d9be0)}
.pl{border:0;background:#07173f;color:#ffd35c;font-weight:900;box-shadow:inset 0 0 0 1px var(--ring)}
.nav{background:linear-gradient(#123c94,#09215f);border-top:0;box-shadow:inset 0 3px 0 #09194a,0 -4px 12px #0005}
.tab{color:#aac5f6;font-weight:900}
.tab.on{color:#fff;background:linear-gradient(#ffe48a,#f0b32a 45%,#b8740f);box-shadow:inset 0 2px 0 #fff3b8,0 3px 0 #6a3d00;text-shadow:0 1px 0 #6a3d00,1px 0 0 #6a3d00,-1px 0 0 #6a3d00,0 -1px 0 #6a3d00}

/* in-game HUD */
#gw{background:#07173f;box-shadow:0 0 0 3px #09194a,0 0 0 5px #2f66d0,0 10px 50px #000b}
#top,#bot{background:linear-gradient(#17479f,#0d2c70)}
#top{box-shadow:inset 0 -2rem 0 #09194a}#bot{box-shadow:inset 0 2rem 0 #09194a}
#tm{color:#fff;font-weight:900;text-shadow:0 1px 0 #06143a,1px 0 0 #06143a,-1px 0 0 #06143a,0 -1px 0 #06143a}
#cr{padding:2rem 9rem;border-radius:99rem;background:#07173f;color:#ffd35c;font-weight:900;box-shadow:inset 0 0 0 1px var(--ring)}
.ib{background:linear-gradient(#112b68,#0a1d4b);color:#fff;box-shadow:inset 0 0 0 1px var(--ring),0 2rem 0 #04102f}
#matchnames{color:#ffd35c}
.eb{background:#07173f;box-shadow:inset 0 0 0 1px var(--ring)}
.eb b{text-shadow:0 1px 0 #3b0a55,1px 0 0 #3b0a55,-1px 0 0 #3b0a55,0 -1px 0 #3b0a55}

/* hand cards: same gold chamfered frame and elixir drop as the deck screen */
.cd{isolation:isolate;position:relative;width:68rem;height:80rem;padding:0;border:0;border-radius:0;overflow:visible;background:none;box-shadow:none;transition:transform .15s,filter .15s}
.cd::before,.cd::after{content:'';position:absolute;clip-path:polygon(20% 0,80% 0,100% 11%,100% 90%,80% 100%,20% 100%,0 90%,0 11%)}
.cd::before{inset:0;background:linear-gradient(155deg,#fff2a8,#f4bd32 35%,#c4821a 68%,#f7d35f)}
.cd::after{inset:2.5rem;background:radial-gradient(circle at 50% 36%,var(--q1,#86a9dc),var(--q2,#2f4f86) 78%)}
.cd img{position:relative;z-index:1;display:block;width:86%;height:70%;margin:7% auto 0;object-fit:contain;filter:drop-shadow(0 2rem 3rem #0008)}
.cd small{z-index:2;left:2.5rem;right:2.5rem;bottom:2.5rem;padding:2rem 1rem 2.5rem;overflow:hidden;font-size:9rem;font-weight:900;line-height:1.1;white-space:nowrap;text-overflow:ellipsis;color:var(--bt,#b4e2ff);background:linear-gradient(var(--b1,#2b3d7d),var(--b2,#18244f));text-shadow:0 1px 0 var(--bo,#08113a),1px 0 0 var(--bo,#08113a),-1px 0 0 var(--bo,#08113a),0 -1px 0 var(--bo,#08113a);box-shadow:inset 0 1px 0 #ffffff55}
.cd.ln small{font-size:7.5rem}
.cd i{z-index:2;left:-3rem;top:-3rem;width:24rem;height:24rem;border:2rem solid #f6d0ff;border-radius:50% 0 50% 50%;background:radial-gradient(circle at 35% 30%,#ff9bff,#cf3cee 45%,#7a16a8);box-shadow:0 2rem 3rem #0008,inset 0 -3rem 3rem #5b0f7e88;font:900 13rem/20rem system-ui;color:#fff;text-shadow:0 1px 0 #4b0a66,1px 0 0 #4b0a66,-1px 0 0 #4b0a66,0 -1px 0 #4b0a66}
.cd.nx{width:36rem;height:44rem;opacity:.8}
.cd.nx::after{inset:1.5rem}
.cd.nx img{width:86%;height:74%;margin:8% auto 0}
.cd.sel{outline:0;border:0;transform:translateY(-8rem);filter:drop-shadow(0 0 5rem #35d0ff) drop-shadow(0 0 2rem #8ff0ff);box-shadow:none}
.cd.no{opacity:.5;filter:grayscale(.6)}

/* battle emotes */
.emote-toggle{border-color:#f1b92f;background:linear-gradient(#2d72dc,#1550b0)}
.emote-tray{background:linear-gradient(#17479f,#0d2c70);border-color:#f1b92f}
.emote-pick{background:linear-gradient(#112b68,#0a1d4b);border:0;box-shadow:inset 0 0 0 1px var(--ring)}
.emote-toast{background:#07173fee;border-color:#f1b92f}

/* focus + motion */
.btn:focus-visible,.rb:focus-visible,.sl:focus-visible,.pl:focus-visible,.cd:focus-visible,.ib:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.btn,.rb,.tile,.sl,.cd,.tab{transition:none}.sl.go{animation:none}}

/* ===== Home hub: Clash Royale layout (top bar, arena, battle row, chests, nav) ===== */
.hb{padding:0 0 14px;gap:10px}.hb>*{flex:none}
.hb.t-battle,.hb.t-pass,.hb.t-modes{background:linear-gradient(135deg,#0000 0 48%,#0a2f6a66 48% 52%,#0000 52%) 0 0/46px 46px,linear-gradient(45deg,#0000 0 48%,#0a2f6a66 48% 52%,#0000 52%) 0 0/46px 46px,linear-gradient(#2f78c6,#2260ad 50%,#1b4d92)}
.hb.t-shop{background:linear-gradient(135deg,#0000 0 48%,#0b4a4d77 48% 52%,#0000 52%) 0 0/46px 46px,linear-gradient(45deg,#0000 0 48%,#0b4a4d77 48% 52%,#0000 52%) 0 0/46px 46px,linear-gradient(#5aa9a3,#3f8c8c)}
.hb.kbg{background:linear-gradient(#0f3f8f,#0a2a6a 45%,#071a46)}
.hb.t-shop,.hb.t-pass,.hb.t-modes,.hb.kbg{padding:12px}
.topbar{gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:linear-gradient(#0e2a5e,#0a2150);box-shadow:inset 0 -2px 0 #05122e,0 3px 10px #0007}
.topbar .avatar{width:40px;height:46px;margin-right:-4px;padding-top:11px;z-index:1;border:3px solid #f4bd32;border-radius:8px;background:linear-gradient(#c37bff,#6a2fb5);box-shadow:0 0 0 2px #4a2a00,0 3px 6px #0007;font:900 19px/1 system-ui;color:#fff;text-shadow:0 2px 0 #3b0a66,1px 0 0 #3b0a66,-1px 0 0 #3b0a66;transform:rotate(-6deg)}
.avatar::before{content:'\265B';position:absolute;top:0;left:0;right:0;font-size:12px;line-height:14px;text-align:center;color:#ffd35c}
.topbar .xb{flex:1;min-width:56px}
.topbar .bar{position:relative;height:24px;border-radius:12px;background:#06173f;box-shadow:inset 0 0 0 2px #1d4a8f}
.topbar .bar i{background:linear-gradient(#7be9ff,#18a6e8)}
.topbar .bar b{position:absolute;inset:0;font:900 14px/24px system-ui;text-align:center;color:#fff;text-shadow:0 2px 0 #06173f,1px 0 0 #06173f,-1px 0 0 #06173f}
.topbar .pl{display:flex;align-items:center;gap:5px;height:30px;padding:0 4px 0 6px;border-radius:15px;background:#06173f;box-shadow:inset 0 0 0 2px #1d4a8f;color:#fff;font:900 15px/1 system-ui;text-shadow:0 2px 0 #06173f,1px 0 0 #06173f,-1px 0 0 #06173f;cursor:pointer}
.topbar .pl em{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:linear-gradient(#7dee6e,#2fae3a);font:900 18px/1 system-ui;font-style:normal;text-shadow:0 1px 0 #17661d}
.topbar .gr{justify-content:center;width:32px;padding:0;font-size:18px;color:#bcd6ff}
.coin,.gem{flex:none;display:inline-block}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6,#f4bd32 55%,#b8740f);box-shadow:0 0 0 2px #7a4a00}
.gem{width:13px;height:13px;margin:0 3px;border-radius:3px;transform:rotate(45deg);background:linear-gradient(135deg,#a8ffb4,#1fae4b);box-shadow:0 0 0 2px #0c6b2b}
.ban,.evs,.aren,.btl{width:100%}
.ban{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#0000,#06173f88)}
.bn{display:flex;flex-direction:column;min-width:0}
.bn b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:900 19px/1.15 system-ui;color:#fff;text-shadow:0 2px 0 #06173f,1px 0 0 #06173f,-1px 0 0 #06173f}
.bn span{font-size:12px;color:#bcd6ff}
.trp{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#06173fcc;box-shadow:inset 0 0 0 2px #1d4a8f;font:900 20px/1 system-ui;color:#ffd35c;text-shadow:0 2px 0 #06173f}
.evs{display:flex;justify-content:center;gap:14px;padding:0 12px}
.evb{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px;padding:0;background:none}
.evb i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font-size:28px;font-style:normal;background:radial-gradient(circle at 50% 30%,#4fd0c4,#17687f 75%);box-shadow:0 0 0 4px #f4bd32,0 0 0 6px #6a3d00,0 4px 8px #0008;transition:transform .12s}
.evb:active i{transform:scale(.94)}
.evb small{font:900 12px/1 system-ui;color:#fff;text-shadow:0 2px 0 #06173f,1px 0 0 #06173f,-1px 0 0 #06173f}
.aren{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 12px}
.arsv{width:min(300px,84%);height:auto;filter:drop-shadow(0 8px 10px #0008)}
.aren b{padding:3px 14px;border-radius:12px;background:#06173fcc;font:900 14px/1.3 system-ui;color:#fff}
.btl{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 12px}
.bgo{flex:1;max-width:300px;height:68px;border-radius:14px;background:linear-gradient(#ffd96a,#f5ad1b 55%,#d98a0c);font:900 34px/1 system-ui;color:#fff;text-shadow:0 3px 0 #7a4400,2px 0 0 #7a4400,-2px 0 0 #7a4400,0 -2px 0 #7a4400;box-shadow:inset 0 3px 0 #fff0a8,inset 0 -5px 0 #c27608,0 5px 0 #6a3d00,0 10px 16px #0008}
.bgo:active{transform:translateY(3px);box-shadow:inset 0 3px 0 #fff0a8,inset 0 -5px 0 #c27608,0 2px 0 #6a3d00}
.bdk,.bem{position:relative;flex:none;width:68px;height:68px;padding:4px;border-radius:14px;background:linear-gradient(#ffe08a,#f0b32a 55%,#b8740f);box-shadow:0 4px 0 #6a3d00,0 8px 12px #0007}
.bdk i,.bem i{display:grid;place-items:center;width:100%;height:100%;border-radius:10px;font-size:30px;font-style:normal;background:linear-gradient(#2d72dc,#12408a);box-shadow:inset 0 0 0 2px #0a1f55}
.bdk b{position:absolute;left:4px;right:4px;bottom:4px;border-radius:0 0 10px 10px;background:linear-gradient(#59b8ff,#1d6fd6);font:900 16px/20px system-ui;text-align:center;color:#fff;text-shadow:0 1px 0 #06143a}
.t-battle>.panel{width:calc(100% - 24px)}
.t-battle .chp{padding:0;background:none;box-shadow:none}.t-battle .chp .chh,.t-battle .chp>.mu{display:none}
.t-battle .sl{min-height:128px;padding:6px 2px 8px;border-radius:12px;background:linear-gradient(#5d86c9,#3a62a6);box-shadow:inset 0 0 0 2px #1e3d78,0 4px 0 #10224f;color:#fff}
.t-battle .sl b{font-size:12px;color:#fff;text-shadow:0 1px 0 #10224f}
.t-battle .sl small{margin-top:auto;padding:2px 8px;border-radius:8px;background:#10224f99;color:#fff;font:900 13px/1.3 system-ui}
.t-battle .sl.em{background:#10224f66;border:2px dashed #7fa4e6;box-shadow:none}
.t-battle .sl.go{background:linear-gradient(#ffd96a,#f0a516);color:#5a3000}.t-battle .sl.go small{color:#fff}
.mkt{align-self:center;margin:2px 0 4px;padding:8px 40px;border:3px solid #4a2b0a;border-radius:8px;background:repeating-linear-gradient(90deg,#9b6a35 0 38px,#8a5a2b 38px 40px);box-shadow:0 5px 0 #4a2b0a66,0 8px 12px #0007;font:900 30px/1 system-ui;color:#2a1604;text-shadow:0 2px 0 #c99a5b}
.t-shop .panel{background:#17586088;box-shadow:inset 0 0 0 2px #7fd1c9,inset 0 0 0 4px #0b3a40,0 6px 16px #0006}
.t-shop .dd{padding:0 0 12px;background:none;box-shadow:none}
.t-shop .dd>h2{width:calc(100% - 8px);margin:0 auto 4px;padding:10px 40px;clip-path:polygon(0 50%,5% 0,95% 0,100% 50%,95% 100%,5% 100%);background:linear-gradient(#5fa2c5,#3d7fa4);font-size:26px;text-align:center;color:#fff}
.t-shop .dd>.mu{margin:0 0 10px;padding:4px 10px;border-radius:0 0 12px 12px;background:#2f5f6bb0;color:#bfe1ff;font-weight:800;text-align:center}
.t-shop .rb{background:linear-gradient(#b9c8f7,#92a6ea);color:#fff;box-shadow:inset 0 0 0 3px #6d82d6,0 4px 0 #3a4a99}
.t-shop .rb b{font-size:13px;text-shadow:0 2px 0 #1c2a6b,1px 0 0 #1c2a6b,-1px 0 0 #1c2a6b}.t-shop .rb small{color:#27388a}
.nav{height:66px;padding:0;align-items:stretch;background:#33507a;box-shadow:inset 0 3px 0 #1f3558,0 -4px 12px #0006}
.nav .tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border-radius:0;background:none;box-shadow:none;font-size:0;color:#fff;transform:none;transition:flex .2s}
.nav .tab i{display:block;width:42px;height:42px}.nav .tab i svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 0 #0007)}
.nav .tab.on{flex:1.9;padding:0;background:linear-gradient(#5d82b3,#3f6194);font-size:13px;line-height:1;text-shadow:0 2px 0 #10224f,1px 0 0 #10224f,-1px 0 0 #10224f;box-shadow:none}
.nav .tab.on i{height:38px;transform:translateY(-4px) scale(1.12)}
.nav .tab.on::before,.nav .tab.on::after{content:'';position:absolute;top:50%;margin-top:-7px;border:7px solid transparent}
.nav .tab.on::before{left:2px;border-right-color:#63b7ff}.nav .tab.on::after{right:2px;border-left-color:#63b7ff}
.nav .tab.on:first-child::before,.nav .tab.on:last-child::after{display:none}
.nav .tab[data-t=battle]:not(.on){background:linear-gradient(#ffd35c,#f0a516)}
.trp:focus-visible,.evb:focus-visible,.bgo:focus-visible,.bdk:focus-visible,.bem:focus-visible,.topbar .pl:focus-visible{outline:2px solid #fff;outline-offset:2px}

function netMsg(m){

// Runs the shared simulation at a fixed 60 ticks/s using the turns the server sent.
function netStep(dt){

 G.u.forEach(e=>{if(e.s==b.s||e.hp<=0||e.fl&&b.ta===0)return;const d=D(e.x-b.x,e.y-b.y)-e.r;if(d<=b.rng&&d<bd){bd=d;t=e}});
 G.tw.forEach(w=>{if(w.s==b.s||w.hp<=0)return;const d=D(w.x-b.x,w.y-b.y)-w.r;if(d<=b.rng&&d<bd){bd=d;t=w}});return t}

function bld(b,dt){const d=C[b.id];if(b.deploy>0){b.deploy=Math.max(0,b.deploy-dt);return}b.lf-=dt;
 if(b.lf<=0){b.hp=0;G.fx.push({k:'rg',x:b.x,y:b.y,t:0,d:.5,r:b.r+14});return}
 if(b.stun>0){b.stun-=dt;b.lk=0;return}
 const f=(b.rage>0?1.4:1)*(b.slow>0?.65:1);if(b.rage>0)b.rage-=dt;if(b.slow>0)b.slow-=dt;
 if(d.su){b.sq-=dt*f;if(b.sq<=0){b.sq+=d.sr;spawn(b.s,d.su,b.x,b.y+(b.s?1:-1)*(b.r+9),b.id,d.sn)}return}
 if(d.ex){b.sq-=dt*f;if(b.sq<=0){b.sq+=d.sr;G.el[b.s]=Math.min(10,G.el[b.s]+d.ex);for(let i=0;i<4;i++)G.fx.push({k:'pt',x:b.x+(i-1.5)*5,y:b.y-b.r,vx:(i-1.5)*14,vy:-60,t:0,d:.6,c:'#e08cff'})}return}
 b.t-=dt*f;
 if(b.tg&&(b.tg.hp<=0||D(b.tg.x-b.x,b.tg.y-b.y)-b.tg.r>b.rng))b.tg=null;
 if(!b.tg){b.tg=bpick(b);b.lk=0}
 const g=b.tg;if(!g)return;
 if(b.t<=0){b.t=b.cd;if(b.inf){hit(b,g,b.dmg*(1+Math.min(b.lk,4)*1.5));b.lk+=b.cd}else G.p.push({k:'a',s:b.s,x:b.x,y:b.y,tg:g,dm:b.dmg,v:280,u:b,bl:b.id=='cannon'?1:0})}}

function zpl(s,id,x,y,m){const d=C[id],r=d.rad*(G.dmp?.5:1);G.p.push({k:'z',ty:d.zn,id,s,x,y,t:0,tc:0,du:d.du,rad:r,dm:(d.dmg||0)*m});G.fx.push({k:'rg',x,y,t:0,d:.5,r})}
function zone(p,dt){p.t+=dt;p.tc+=dt;const near=e=>e.hp>0&&D(e.x-p.x,e.y-p.y)<=p.rad+e.r;
 if(p.ty=='freeze')G.u.forEach(e=>{if(e.s!=p.s&&near(e)){e.stun=Math.max(e.stun||0,.3)}});
 else if(p.ty=='graveyard'){if(p.tc>=1.15){p.tc-=1.15;const a=[[-18,-10],[16,8],[0,20]];const q=a[(p.n||0)%a.length];spawn(p.s,'skeleton_knights',p.x+q[0],p.y+q[1],'graveyard',1);p.n=(p.n||0)+1}}
 else if(p.tc>=.5){p.tc-=.5;
  if(p.ty=='poison'){G.u.forEach(e=>{if(e.s!=p.s&&near(e))hurt(e,p.dm*.5)});G.tw.forEach(t=>{if(t.s!=p.s&&near(t))hurt(t,p.dm*.5*.4)})}
  else if(p.ty=='quake'){G.u.forEach(e=>{if(e.s!=p.s&&near(e)&&!e.fl)hurt(e,p.dm*.5)});G.tw.forEach(t=>{if(t.s!=p.s&&near(t))hurt(t,p.dm*.5*.35)})}
  else G.u.forEach(e=>{if(e.s==p.s&&near(e))e.hp=Math.min(e.mx,e.hp+p.dm*.5)})}
 if(p.t>=p.du)p.dn=1}

 G.u.forEach(e=>{if(e.s!=s&&e.hp>0&&D(e.x-x,e.y-y)<=r+e.r){e.stun=Math.max(e.stun||0,d.st)}});
 G.tw.forEach(t=>{if(t.s!=s&&t.hp>0&&D(t.x-x,t.y-y)<=r+t.r)t.cd=Math.max(t.cd,d.st)});

<script id="gfx">
/* =====================================================================================
   GFX · CARD ART PIPELINE  (visual only — touches IMG/ART images, never game state)
   1. richen(): every flat fill in a card's SVG becomes a soft lit gradient (warm light
      from the upper left, cool shade low right), eyes get catch-lights.
   2. bake(): the SVG is rasterised once and finished in a tiny software shader:
      ambient occlusion, bevel light, rim light, tone-on-tone edge, fine grain.
   3. The finished bitmap replaces IMG[id] (blob: URL so HTML stays small).
   ===================================================================================== */
const GFX=(()=>{
const SZ=192;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const h2r=h=>{h=h.replace('#','');if(h.length==3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]};
const r2h=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const hsl2r=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]};
const lum=c=>.299*c[0]+.587*c[1]+.114*c[2];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const WARM=[255,243,214],COOL=[18,26,58];
/* lit / shade tones of one base colour. Dark colours are lifted a little so shading stays visible. */
function tones(c){const l=lum(c)/255;const hi=mix(c,WARM,.10+.20*(1-l)),lo=mix(c,COOL,.20+.12*l);return[r2h(...hi),r2h(...c),r2h(...lo)]}

/* ---- stage 1: vector lighting -------------------------------------------------- */
function richen(inner){
  const defs=new Map();let n=0;
  const gid=hex=>{let k=hex.toLowerCase();if(k.length==4)k='#'+k.slice(1).split('').map(c=>c+c).join('');if(!defs.has(k)){const[a,b,c]=tones(h2r(k));defs.set(k,{id:'L'+(n++),a,b,c})}return defs.get(k).id};
  let s=inner.replace(/fill=(["'])hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)\1/g,(m,q,h,sa,l)=>`fill=${q}${r2h(...hsl2r(+h,+sa,+l))}${q}`);
  s=s.replace(/fill=(["'])(#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6})\1/g,(m,q,hex)=>`fill=${q}url(#${gid(hex)})${q}`);
  /* eye catch-lights: small dark circles get a white glint */
  s=s.replace(/<circle\b[^>]*>/g,m=>{const g=k=>{const r=new RegExp(k+'=["\']([^"\']+)["\']').exec(m);return r?r[1]:null};
    const r=+g('r'),f=g('fill'),cx=+g('cx'),cy=+g('cy');
    if(r>=1&&r<=4.2&&f&&/^url\(#L\d+\)$/.test(f)){const hex=[...defs].find(([k,v])=>'url(#'+v.id+')'==f);if(hex&&lum(h2r(hex[0]))<70)return m+`<circle cx="${cx+r*.34}" cy="${cy-r*.38}" r="${Math.max(.45,r*.36)}" fill="#fff" fill-opacity=".92"/>`}
    return m});
  let d='';for(const v of defs.values())d+=`<linearGradient id="${v.id}" x1=".15" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${v.a}"/><stop offset=".5" stop-color="${v.b}"/><stop offset="1" stop-color="${v.c}"/></linearGradient>`;
  return `<defs>${d}</defs>${s}`}

/* ---- stage 2: software finishing shader ---------------------------------------- */
function boxBlur(src,w,h,r){/* separable box blur, edge-clamped */
  const t=new Float32Array(w*h),o=new Float32Array(w*h),k=1/(2*r+1);
  for(let y=0;y<h;y++){let acc=0;const row=y*w;for(let i=-r;i<=r;i++)acc+=src[row+clamp(i,0,w-1)];for(let x=0;x<w;x++){t[row+x]=acc*k;acc+=src[row+clamp(x+r+1,0,w-1)]-src[row+clamp(x-r,0,w-1)]}}
  for(let x=0;x<w;x++){let acc=0;for(let i=-r;i<=r;i++)acc+=t[clamp(i,0,h-1)*w+x];for(let y=0;y<h;y++){o[y*w+x]=acc*k;acc+=t[clamp(y+r+1,0,h-1)*w+x]-t[clamp(y-r,0,h-1)*w+x]}}
  return o}
function prng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function finish(ctx,seed){
  const W=SZ,H=SZ,N=W*H,im=ctx.getImageData(0,0,W,H),d=im.data;
  const a=new Float32Array(N);for(let i=0;i<N;i++)a[i]=d[i*4+3]/255;
  const b1=boxBlur(a,W,H,2),b2=boxBlur(a,W,H,6),b3=boxBlur(boxBlur(a,W,H,5),W,H,5);
  const rnd=prng(seed),g1=new Float32Array(N);for(let i=0;i<N;i++)g1[i]=rnd()*2-1;const g2=boxBlur(g1,W,H,2);
  const lx=.58,ly=.7;
  for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){
    const i=y*W+x,p=i*4,al=a[i];if(al<.02)continue;
    const hx=(b3[i+2]-b3[i-2])*.25,hy=(b3[i+2*W]-b3[i-2*W])*.25;
    const lit=clamp((hx*lx+hy*ly)*5.2,-1,1);               /* bevel light: + toward upper left */
    const crop=y>166?1-.65*clamp((y-166)/18,0,1):1;   /* busts are cropped at the sprite bottom: no hard base line */
    const occ1=clamp(1-b1[i]/al,0,1)*crop,occ2=clamp(1-b2[i]/al,0,1)*crop;
    let r=d[p],g=d[p+1],b=d[p+2];
    let k=1-.30*occ1-.34*occ2;                              /* ambient occlusion + tone-on-tone edge */
    k+=lit>0?lit*.20:lit*.30;                               /* lit side brighter, shade side darker */
    const lm=(d[p]*.299+d[p+1]*.587+d[p+2]*.114)/255,gr=.022*(1-.7*clamp((lm-.55)/.4,0,1));k*=1+g1[i]*gr+g2[i]*gr*1.1;   /* fine grain + soft mottling (calmer on bright glows) */
    r*=k;g*=k;b*=k;
    if(lit>.12){const s=(lit-.12)*.9*occ2*2.2;r+=255*s*.30;g+=240*s*.30;b+=215*s*.30}          /* warm key-light sheen */
    if(lit<-.1){const s=(-lit-.1)*clamp(occ2*3,0,1)*.38;r+=120*s;g+=170*s;b+=235*s}            /* cool rim on shade side */
    d[p]=clamp(r,0,255);d[p+1]=clamp(g,0,255);d[p+2]=clamp(b,0,255)}
  ctx.putImageData(im,0,0)}

function svgOf(inner){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${SZ}' height='${SZ}' viewBox='0 0 64 64'>`+inner+'</svg>').replace(/'/g,'%27')}
function bake(id,inner){
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{try{
    const c=document.createElement('canvas');c.width=c.height=SZ;const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(im,0,0,SZ,SZ);let h=7;for(const ch of id)h=(h*31+ch.charCodeAt(0))|0;finish(x,h);res(c)}catch(e){rej(e)}};im.onerror=()=>rej(new Error('svg '+id));im.src=svgOf(richen(inner))})}

/* ---- hand-drawn replacements for the simplest spell icons (same card ids, same meaning) ---- */
